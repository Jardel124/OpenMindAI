
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenMindAI — Teste Neural</title>
</head>
<body>
    <h1>OpenMindAI — Rede Neural</h1>
    <pre id="output">Preparando treinamento...</pre>

    <script type="module">
        import { OpenMindTokenizer } from "./tokenizer.js";
        import { OpenMindNeuralNetwork } from "./neural-network.js";

        const output = document.getElementById("output");

        try {
            const texts = [
                "Olá mundo",
                "Olá OpenMindAI",
                "Olá mundo",
                "Eu sou OpenMindAI",
                "Eu aprendo palavras",
                "Eu sou uma inteligência artificial"
            ];

            const tokenizer = new OpenMindTokenizer();
            tokenizer.train(texts);

            const network = new OpenMindNeuralNetwork(
                tokenizer.vocabSize,
                16
            );

            const history = network.train(tokenizer, texts, 150);

            const firstToken = tokenizer.encode("Olá")[0];
            const predictions = network.predictNext(
                firstToken,
                tokenizer,
                5
            );

            output.textContent =
                `Treinamento concluído!\n\n` +
                `Vocabulário: ${tokenizer.vocabSize} tokens\n` +
                `Dimensão interna: ${network.hiddenSize}\n` +
                `Épocas: ${history.length}\n` +
                `Perda inicial: ${history[0].toFixed(4)}\n` +
                `Perda final: ${history.at(-1).toFixed(4)}\n\n` +
                `Próximos tokens previstos após "Olá":\n` +
                predictions.map(item =>
                    `${item.token}: ${(item.probability * 100).toFixed(2)}%`
                ).join("\n");
        } catch (error) {
            output.textContent = error.stack || error.message;
        }
    </script>
</body>
</html>
